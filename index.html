```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLBB TOURNAMENT</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at top left,#1475e8,transparent 35%),
    radial-gradient(circle at bottom right,#ffd600,transparent 30%),
    linear-gradient(135deg,#020b20,#073b8f,#03102d);
}

header{
  text-align:center;
  padding:25px 15px;
  background:rgba(0,0,0,.4);
  border-bottom:3px solid #ffd600;
}

.logo{
  color:#ffd600;
  font-size:30px;
  font-weight:900;
  text-shadow:0 0 18px #ffd600;
}

.subtitle{
  margin-top:7px;
  color:#ddd;
  font-size:13px;
}

nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px;
  background:#04112d;
  position:sticky;
  top:0;
  z-index:50;
}

nav button{
  white-space:nowrap;
  padding:11px 15px;
  border:1px solid #ffd600;
  border-radius:10px;
  background:#0750a8;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

nav button:hover,
nav button.active{
  background:#ffd600;
  color:#03102d;
}

.container{
  width:min(1100px,94%);
  margin:25px auto 50px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.card{
  background:rgba(3,16,45,.94);
  border:1px solid rgba(255,214,0,.5);
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h2{
  color:#ffd600;
  margin-bottom:18px;
}

h3{
  color:#ffd600;
  margin-bottom:12px;
}

.group-title{
  background:#ffd600;
  color:#03102d;
  padding:13px;
  border-radius:12px;
  text-align:center;
  font-size:20px;
  font-weight:900;
  margin:20px 0 15px;
}

.team-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:15px;
}

.team-card{
  background:linear-gradient(145deg,#0a4fa8,#061c47);
  padding:17px;
  border-radius:15px;
  border:1px solid rgba(255,214,0,.4);
}

input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:12px;
  border:none;
  outline:none;
  border-radius:9px;
  background:#fff;
  color:#111;
  font-size:14px;
}

label{
  display:block;
  color:#ddd;
  font-size:13px;
}

.player-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.player-number{
  width:32px;
  height:32px;
  min-width:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ffd600;
  color:#03102d;
  border-radius:50%;
  font-weight:900;
}

.match{
  background:#061d49;
  border:1px solid rgba(255,214,0,.35);
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

.match-title{
  color:#ffd600;
  font-size:12px;
  font-weight:bold;
  margin-bottom:10px;
}

.match-row{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  gap:10px;
  text-align:center;
}

.team-name{
  font-weight:bold;
  word-break:break-word;
}

.vs{
  color:#ffd600;
  font-weight:900;
}

.score{
  width:80px;
  margin:0 auto;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

table{
  width:100%;
  border-collapse:collapse;
}

.table-wrap{
  overflow-x:auto;
}

th{
  background:#ffd600;
  color:#03102d;
  padding:12px 7px;
  font-size:12px;
}

td{
  padding:11px 7px;
  border-bottom:1px solid rgba(255,255,255,.1);
  text-align:center;
  font-size:13px;
}

td:nth-child(2){
  text-align:left;
  font-weight:bold;
}

.playoff-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.bracket{
  background:linear-gradient(145deg,#0b4fa8,#04122f);
  border:2px solid #ffd600;
  border-radius:17px;
  padding:18px;
}

.bracket h3{
  text-align:center;
}

.bracket-team{
  background:#020c22;
  border-radius:10px;
  padding:15px;
  text-align:center;
  margin:9px 0;
  font-weight:bold;
}

.final-box{
  background:linear-gradient(145deg,#0b4fa8,#04122f);
  border:2px solid #ffd600;
  border-radius:18px;
  padding:25px;
  text-align:center;
}

.champion{
  margin-top:20px;
  padding:25px;
  background:linear-gradient(145deg,#ffd600,#a47e00);
  color:#03102d;
  border-radius:16px;
  font-weight:900;
}

.champion-name{
  font-size:28px;
  margin-top:10px;
}

.btn{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#ffd600;
  color:#03102d;
  font-weight:900;
  cursor:pointer;
}

.btn:hover{
  opacity:.85;
}

.info{
  background:rgba(255,255,255,.06);
  border-left:4px solid #ffd600;
  padding:12px;
  border-radius:8px;
  color:#ddd;
  font-size:13px;
  line-height:1.6;
  margin-bottom:15px;
}

@media(max-width:650px){

  .logo{
    font-size:23px;
  }

  .container{
    width:95%;
  }

  .card{
    padding:14px;
  }

  .playoff-grid{
    grid-template-columns:1fr;
  }

  .match-row{
    grid-template-columns:1fr 60px 1fr;
    gap:5px;
  }

  .score{
    width:60px;
  }
}
</style>
</head>
